<!DOCTYPE html>

<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#16110d">
<meta name="color-scheme" content="dark">
<title>היסטוריית משמרות — אומינו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg-base: #16110d;
    --bg-card: #1f1812;
    --bg-elev: #2a2018;
    --bg-input: #15100c;
    --line: #3a2d23;
    --line-soft: #2d231a;
    --ink: #f4ebdd;
    --ink-soft: #c4b29a;
    --ink-dim: #8a7866;
    --ink-faint: #5a4e42;
    --gold: #d4a857;
    --gold-soft: #b89046;
    --gold-glow: rgba(212, 168, 87, 0.15);
    --green: #7fb069;
    --rust: #c45a4d;
    --warn: #e0a458;
    --font-display: 'Frank Ruhl Libre', serif;
    --font-body: 'Heebo', system-ui, sans-serif;
    --r-sm: 10px;
    --r-md: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  *:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  html, body {
    background: var(--bg-base); color: var(--ink);
    font-family: var(--font-body); min-height: 100vh;
    overflow-x: hidden; max-width: 100vw; line-height: 1.5;
  }
  body {
    background-image:
      radial-gradient(at 80% -10%, rgba(212, 168, 87, 0.08) 0%, transparent 50%),
      radial-gradient(at 0% 100%, rgba(201, 120, 98, 0.06) 0%, transparent 50%);
    padding-bottom: env(safe-area-inset-bottom);
  }

.pin-gate {
position: fixed; inset: 0;
background: var(–bg-base);
background-image: radial-gradient(at 50% 30%, rgba(212, 168, 87, 0.12) 0%, transparent 60%);
z-index: 1000;
display: flex; align-items: center; justify-content: center;
padding: 20px;
}
.pin-card {
width: 100%; max-width: 340px;
background: var(–bg-card); border: 1px solid var(–line);
border-radius: 18px; padding: 36px 26px 28px; text-align: center;
box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.pin-brand { font-family: var(–font-display); font-size: 13px; letter-spacing: 6px; color: var(–gold); text-transform: uppercase; margin-bottom: 8px; font-weight: 600; }
.pin-title { font-family: var(–font-display); font-size: 22px; color: var(–ink); margin-bottom: 6px; font-weight: 500; }
.pin-sub { font-size: 13px; color: var(–ink-dim); margin-bottom: 24px; }
.pin-input {
width: 100%; background: var(–bg-input); border: 1px solid var(–line);
border-radius: var(–r-sm); padding: 14px; color: var(–ink);
font-family: inherit; font-size: 22px; text-align: center;
letter-spacing: 12px; margin-bottom: 14px; outline: none;
-webkit-appearance: none;
}
.pin-input:focus { border-color: var(–gold); box-shadow: 0 0 0 3px var(–gold-glow); }
.pin-error { color: var(–rust); font-size: 12px; min-height: 16px; margin-bottom: 8px; }

.header {
background: linear-gradient(180deg, #1a1410 0%, #16110d 100%);
border-bottom: 1px solid var(–line-soft);
padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
position: sticky; top: 0; z-index: 50;
backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.header-title { font-family: var(–font-display); font-size: 19px; font-weight: 500; color: var(–ink); letter-spacing: 0.2px; }
.header-subtitle { font-size: 10px; color: var(–gold-soft); letter-spacing: 2.5px; text-transform: uppercase; margin-top: 3px; font-weight: 600; }
.back-btn {
background: var(–bg-elev); border: 1px solid var(–line);
color: var(–ink-soft); padding: 8px 14px; border-radius: 999px;
font-family: inherit; font-size: 12px; font-weight: 500;
cursor: pointer; text-decoration: none;
display: inline-flex; align-items: center; gap: 6px;
transition: all 0.15s;
}
.back-btn:active { transform: scale(0.96); background: var(–line); }

.content { padding: 20px 16px 32px; }

.filters {
display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
margin-bottom: 16px;
}
.filters select, .filters input {
width: 100%; background: var(–bg-card); border: 1px solid var(–line);
border-radius: var(–r-sm); padding: 11px 12px; color: var(–ink);
font-family: inherit; font-size: 14px;
-webkit-appearance: none; appearance: none; direction: rtl;
}
.filters select {
background-image: url(“data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%23d4a857' d='M5 6L0 0h10z'/></svg>”);
background-repeat: no-repeat; background-position: left 12px center;
padding-left: 30px; cursor: pointer;
}
.search-wrap { grid-column: 1 / -1; position: relative; }
.search-wrap input { padding-right: 38px; }
.search-wrap::before {
content: ‘🔍’; position: absolute; right: 12px; top: 50%;
transform: translateY(-50%); font-size: 13px; opacity: 0.5; pointer-events: none;
}

.kpis {
display: grid; grid-template-columns: repeat(4, 1fr);
gap: 6px; margin-bottom: 18px;
}
.kpi {
background: var(–bg-card); border: 1px solid var(–line-soft);
border-radius: var(–r-sm); padding: 12px 6px 10px; text-align: center;
}
.kpi-label { font-size: 9px; color: var(–ink-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; font-weight: 600; }
.kpi-value { font-family: var(–font-display); font-size: 18px; font-weight: 700; color: var(–gold); line-height: 1.1; }
.kpi-sub { font-size: 9px; color: var(–ink-faint); margin-top: 3px; }

.chart-card {
background: var(–bg-card); border: 1px solid var(–line-soft);
border-radius: var(–r-md); padding: 14px; margin-bottom: 12px;
}
.chart-title { font-family: var(–font-display); font-size: 13px; color: var(–gold); margin-bottom: 10px; letter-spacing: 0.3px; }
.chart-wrap { height: 160px; position: relative; }

.section-head { display: flex; align-items: baseline; gap: 12px; margin: 24px 4px 12px; }
.section-head::after { content: ‘’; flex: 1; height: 1px; background: linear-gradient(90deg, var(–line) 0%, transparent 100%); }
.section-title { font-family: var(–font-display); font-size: 15px; font-weight: 500; color: var(–gold); letter-spacing: 0.3px; }
.section-count { font-family: var(–font-display); font-size: 11px; color: var(–ink-faint); font-style: italic; }

.report-list { display: flex; flex-direction: column; gap: 10px; }
.report {
background: var(–bg-card); border: 1px solid var(–line-soft);
border-radius: var(–r-md); padding: 14px 14px 12px;
cursor: pointer; transition: all 0.15s;
}
.report:active { transform: scale(0.99); border-color: var(–gold); }
.report-row1 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.report-date { font-family: var(–font-display); font-size: 14px; color: var(–ink); font-weight: 500; }
.report-pill {
font-size: 9px; text-transform: uppercase; letter-spacing: 1px;
padding: 3px 9px; border-radius: 999px; font-weight: 600;
}
.report-pill.evening { background: rgba(212, 168, 87, 0.15); color: var(–gold); }
.report-pill.morning { background: rgba(127, 176, 105, 0.15); color: var(–green); }
.report-pill.full_day { background: rgba(196, 90, 77, 0.15); color: var(–rust); }
.report-mgr { font-size: 12px; color: var(–ink-soft); margin-bottom: 10px; }
.report-stats {
display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
border-top: 1px solid var(–line-soft); padding-top: 10px;
}
.report-stat { text-align: center; }
.report-stat-label { font-size: 9px; color: var(–ink-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.report-stat-value { font-family: var(–font-display); font-size: 14px; font-weight: 600; color: var(–ink); }
.report-flags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.flag {
font-size: 10px; padding: 3px 8px; border-radius: 6px;
font-weight: 500; display: inline-flex; align-items: center; gap: 4px;
}
.flag.warn { background: rgba(224, 164, 88, 0.12); color: var(–warn); }
.flag.err { background: rgba(196, 90, 77, 0.12); color: var(–rust); }
.flag.ok { background: rgba(127, 176, 105, 0.12); color: var(–green); }

.empty-state { text-align: center; padding: 40px 20px; color: var(–ink-dim); }
.empty-state-icon { font-size: 36px; opacity: 0.4; margin-bottom: 12px; }
.empty-state-text { font-size: 14px; }
.loading { text-align: center; padding: 40px 20px; color: var(–ink-dim); font-size: 14px; }
.spinner-mini {
display: inline-block; width: 18px; height: 18px;
border: 2px solid var(–line); border-top-color: var(–gold);
border-radius: 50%; animation: spin 0.8s linear infinite;
vertical-align: middle; margin-left: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.modal-overlay {
position: fixed; inset: 0;
background: rgba(8, 5, 3, 0.75);
backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
z-index: 100; display: none;
align-items: flex-end; justify-content: center;
animation: fadeIn 0.2s ease-out;
}
.modal-overlay.show { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
background: var(–bg-card); width: 100%; max-width: 500px; max-height: 92vh;
border-radius: 22px 22px 0 0; border-top: 1px solid var(–line);
padding: 16px 18px calc(22px + env(safe-area-inset-bottom));
overflow-y: auto; box-shadow: 0 -16px 48px rgba(0,0,0,0.5);
animation: slideUp 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 36px; height: 4px; background: var(–line); border-radius: 99px; margin: 0 auto 16px; }
.modal-title { font-family: var(–font-display); font-size: 18px; color: var(–gold); text-align: center; margin-bottom: 4px; font-weight: 500; }
.modal-meta { text-align: center; color: var(–ink-dim); font-size: 12px; margin-bottom: 18px; }

.detail-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 18px; }
.detail-kpi {
text-align: center; background: var(–bg-elev);
border: 1px solid var(–line-soft); border-radius: var(–r-sm);
padding: 10px 6px;
}
.detail-kpi-label { font-size: 9px; color: var(–ink-dim); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 3px; font-weight: 600; }
.detail-kpi-val { font-family: var(–font-display); font-size: 16px; color: var(–gold); font-weight: 700; }
.detail-section { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(–line-soft); }
.detail-section:last-of-type { border-bottom: none; margin-bottom: 8px; }
.detail-section-title { font-family: var(–font-display); font-size: 11px; color: var(–gold); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; font-weight: 700; }
.detail-section-text { font-size: 13px; color: var(–ink-soft); line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
.detail-dish {
background: var(–bg-elev); border-right: 3px solid var(–gold);
padding: 7px 11px; margin-bottom: 5px;
font-size: 12px; border-radius: 4px; color: var(–ink-soft);
}

.detail-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 16px; }
.detail-actions .full { grid-column: 1 / -1; }
.action-btn {
padding: 12px; border-radius: var(–r-sm);
font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
border: 1px solid transparent;
display: flex; align-items: center; justify-content: center; gap: 6px;
transition: transform 0.1s;
}
.action-btn:active { transform: scale(0.98); }
.action-pdf {
background: linear-gradient(180deg, var(–gold) 0%, var(–gold-soft) 100%);
color: #1a1410; box-shadow: 0 4px 14px rgba(212, 168, 87, 0.25);
}
.action-wa { background: #1f3a2a; color: #7fd99c; border-color: rgba(127, 217, 156, 0.3); }
.action-copy { background: var(–bg-elev); color: var(–ink-soft); border-color: var(–line); }
.action-edit { background: var(–bg-elev); color: var(–gold); border-color: rgba(212, 168, 87, 0.3); }
.action-del { background: rgba(196, 90, 77, 0.12); color: var(–rust); border-color: rgba(196, 90, 77, 0.3); }

.toast {
position: fixed; top: calc(20px + env(safe-area-inset-top));
left: 50%; transform: translateX(-50%) translateY(-30px);
background: var(–bg-elev); border: 1px solid var(–line);
color: var(–ink); padding: 12px 20px; border-radius: 99px;
z-index: 200; opacity: 0;
transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
pointer-events: none; max-width: 88vw; text-align: center;
font-size: 13px; font-weight: 500; box-shadow: 0 12px 36px rgba(0,0,0,0.5);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.ok { color: var(–green); border-color: rgba(127, 176, 105, 0.3); }
.toast.err { color: var(–rust); border-color: rgba(196, 90, 77, 0.3); }

#pdfTemplate {
position: fixed; left: -99999px; top: 0; width: 794px;
background: #FBF7F0; color: #2C2419;
font-family: ‘Heebo’, sans-serif; direction: rtl;
padding: 56px 50px;
}
#pdfTemplate * { box-sizing: border-box; }
.pdf-head { text-align: center; padding-bottom: 24px; border-bottom: 1px solid #d4c4a8; margin-bottom: 28px; }
.pdf-brand { font-family: ‘Frank Ruhl Libre’, serif; font-size: 13px; letter-spacing: 8px; color: #8B6F47; text-transform: uppercase; margin-bottom: 16px; font-weight: 500; }
.pdf-title-main { font-family: ‘Frank Ruhl Libre’, serif; font-size: 26px; font-weight: 500; color: #2C2419; margin-bottom: 6px; }
.pdf-subtitle { font-size: 13px; color: #8B6F47; letter-spacing: 0.5px; }
.pdf-meta-strip { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; margin-bottom: 22px; background: #d4c4a8; border-radius: 8px; overflow: hidden; }
.pdf-meta-cell { text-align: center; background: #FBF7F0; padding: 14px 10px; }
.pdf-meta-label { font-size: 10px; color: #8B6F47; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 4px; font-weight: 600; }
.pdf-meta-value { font-size: 14px; font-weight: 600; color: #2C2419; }
.pdf-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 28px; }
.pdf-kpi { text-align: center; padding: 14px 8px; background: #fff; border: 1px solid #e8dcc4; border-radius: 8px; }
.pdf-kpi-label { font-size: 9px; color: #8B6F47; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
.pdf-kpi-value { font-family: ‘Frank Ruhl Libre’, serif; font-size: 20px; font-weight: 700; color: #C4924A; }
.pdf-kpi-sub { font-size: 9px; color: #8B6F47; margin-top: 2px; }
.pdf-section { margin-bottom: 20px; }
.pdf-section-title { font-family: ‘Frank Ruhl Libre’, serif; font-size: 11px; letter-spacing: 2.5px; color: #C4924A; text-transform: uppercase; font-weight: 700; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #e8dcc4; }
.pdf-section-text { font-size: 12.5px; line-height: 1.7; color: #2C2419; white-space: pre-wrap; word-wrap: break-word; }
.pdf-sub-block { margin-bottom: 12px; }
.pdf-sub-label { font-size: 11px; color: #6B5B3E; font-weight: 600; margin-bottom: 4px; }
.pdf-dishes { list-style: none; padding: 0; }
.pdf-dishes li { padding: 8px 12px; background: #fff; border-right: 3px solid #C4924A; margin-bottom: 6px; font-size: 12.5px; border-radius: 4px; }
.pdf-foot { margin-top: 32px; padding-top: 16px; border-top: 1px solid #e8dcc4; text-align: center; font-size: 9.5px; color: #8B6F47; letter-spacing: 1.5px; }

.loading-overlay {
position: fixed; inset: 0;
background: rgba(8, 5, 3, 0.85);
backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
z-index: 250; display: none;
align-items: center; justify-content: center;
flex-direction: column; gap: 16px;
}
.loading-overlay.show { display: flex; }
.spinner { width: 44px; height: 44px; border: 3px solid var(–line); border-top-color: var(–gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
.loading-text { color: var(–gold); font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; }
</style>

</head>
<body>

<div class="pin-gate" id="pinGate">
  <div class="pin-card">
    <div class="pin-brand">UMINO</div>
    <div class="pin-title">היסטוריית משמרות</div>
    <div class="pin-sub">הזיני קוד גישה</div>
    <input type="number" inputmode="numeric" maxlength="4" class="pin-input" id="pinInput" autocomplete="off">
    <div class="pin-error" id="pinError"></div>
  </div>
</div>

<header class="header" style="display:none;" id="mainHeader">
  <div class="header-row">
    <div>
      <div class="header-title">היסטוריית משמרות</div>
      <div class="header-subtitle">UMINO MODERN SUSHI</div>
    </div>
    <a href="index.html" class="back-btn">→ חזרה</a>
  </div>
</header>

<main class="content" id="mainContent" style="display:none;">

  <div class="filters">
    <select id="rangeFilter">
      <option value="7">7 ימים אחרונים</option>
      <option value="30" selected>30 ימים אחרונים</option>
      <option value="90">90 ימים אחרונים</option>
      <option value="all">הכל</option>
    </select>
    <select id="managerFilter"><option value="">כל האחמ"שיות</option></select>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="חיפוש בטקסט הדוחות...">
    </div>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="kpi-label">דוחות</div><div class="kpi-value" id="kpiCount">—</div></div>
    <div class="kpi"><div class="kpi-label">הכנסה</div><div class="kpi-value" id="kpiRevenue">—</div></div>
    <div class="kpi"><div class="kpi-label">סועדים</div><div class="kpi-value" id="kpiCovers">—</div><div class="kpi-sub" id="kpiPpa"></div></div>
    <div class="kpi"><div class="kpi-label">החזרות</div><div class="kpi-value" id="kpiReturns">—</div></div>
  </div>

  <div class="chart-card">
    <div class="chart-title">הכנסה יומית</div>
    <div class="chart-wrap"><canvas id="chartRevenue"></canvas></div>
  </div>
  <div class="chart-card">
    <div class="chart-title">PPA לאורך זמן</div>
    <div class="chart-wrap"><canvas id="chartPpa"></canvas></div>
  </div>
  <div class="chart-card">
    <div class="chart-title">סועדים יומי</div>
    <div class="chart-wrap"><canvas id="chartCovers"></canvas></div>
  </div>

  <div class="section-head">
    <span class="section-title">דוחות</span>
    <span class="section-count" id="sectionCount"></span>
  </div>

  <div id="reportList" class="report-list">
    <div class="loading">טוען דוחות<span class="spinner-mini"></span></div>
  </div>
</main>

<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="detailTitle"></div>
    <div class="modal-meta" id="detailMeta"></div>
    <div id="detailBody"></div>
    <div class="detail-actions">
      <button class="action-btn action-pdf full" onclick="exportDetailPdf()">📄 שמור PDF</button>
      <button class="action-btn action-wa" onclick="shareDetailWhatsApp()">💬 וואטסאפ</button>
      <button class="action-btn action-copy" onclick="copyDetail()" id="copyDetailBtn">📋 העתק</button>
      <button class="action-btn action-edit" onclick="editReport()">✏️ ערוך</button>
      <button class="action-btn action-del" onclick="deleteReport()">🗑 מחק</button>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">מייצר PDF...</div>
</div>

<div id="pdfTemplate"></div>
<div class="toast" id="toast"></div>

  } else {
    setTimeout(() => pinInput.focus(), 200);
  }
  pinInput.addEventListener('input', (e) => {
    const v = e.target.value;
    if (v.length === 4) {
      if (v === PIN) {
        sessionStorage.setItem('umino-dash-unlocked', '1');
        enterApp();
      } else {
        document.getElementById('pinError').textContent = 'קוד שגוי';
        e.target.value = '';
        setTimeout(() => document.getElementById('pinError').textContent = '', 2000);
      }
    }
  });
});

function enterApp() {
  document.getElementById('pinGate').style.display = 'none';
  document.getElementById('mainHeader').style.display = 'block';
  document.getElementById('mainContent').style.display = 'block';
  loadReports();
  document.getElementById('rangeFilter').addEventListener('change', applyFilters);
  document.getElementById('managerFilter').addEventListener('change', applyFilters);
  document.getElementById('searchInput').addEventListener('input', debounce(applyFilters, 200));
  document.getElementById('detailModal').addEventListener('click', (e) => {
    if (e.target.id === 'detailModal') closeDetail();
  });
}

function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

async function loadReports() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/shift_reports?venue=eq.umino&order=shift_date.desc,id.desc&limit=500`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
    allReports = await res.json();
    populateManagerFilter();
    applyFilters();
  } catch (e) {
    console.error(e);
    document.getElementById('reportList').innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">שגיאה בטעינה: ${escapeHtml(e.message)}</div></div>`;
  }
}

function populateManagerFilter() {
  const sel = document.getElementById('managerFilter');
  const names = [...new Set(allReports.map(r => r.manager_name).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">כל האחמ"שיות</option>' + names.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
}

function applyFilters() {
  const range = document.getElementById('rangeFilter').value;
  const mgr = document.getElementById('managerFilter').value;
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let f = [...allReports];
  if (range !== 'all') {
    const days = parseInt(range);
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - days);
    f = f.filter(r => new Date(r.shift_date) >= cutoff);
  }
  if (mgr) f = f.filter(r => r.manager_name === mgr);
  if (q) {
    f = f.filter(r => {
      const blob = [r.manager_name, r.shift_narrative, r.floor_notes, r.kitchen_notes, r.discipline_issues, r.wait_times, r.late_arrivals, r.tech_issues, r.shortages, r.credits, r.daily_tasks].filter(Boolean).join(' ').toLowerCase();
      return blob.includes(q);
    });
  }
  filteredReports = f;
  renderKpis(f);
  renderCharts(f);
  renderList(f);
}

function renderKpis(reports) {
  document.getElementById('kpiCount').textContent = reports.length;
  const totalRev = reports.reduce((s, r) => s + (Number(r.revenue) || 0), 0);
  const totalCovers = reports.reduce((s, r) => s + (Number(r.covers) || 0), 0);
  const totalReturns = reports.reduce((s, r) => s + (Number(r.returns_count) || 0), 0);
  document.getElementById('kpiRevenue').textContent = totalRev >= 1000 ? `₪${(totalRev/1000).toFixed(0)}K` : `₪${totalRev}`;
  document.getElementById('kpiCovers').textContent = totalCovers.toLocaleString('he-IL');
  document.getElementById('kpiPpa').textContent = totalCovers ? `₪${Math.round(totalRev/totalCovers)}/סועד` : '';
  document.getElementById('kpiReturns').textContent = totalReturns;
  document.getElementById('sectionCount').textContent = reports.length ? `${reports.length} דוחות` : '';
}

function renderCharts(reports) {
  const sorted = [...reports].sort((a, b) => new Date(a.shift_date) - new Date(b.shift_date));
  const labels = sorted.map(r => {
    const d = new Date(r.shift_date);
    return `${d.getDate()}/${d.getMonth()+1}`;
  });
  const revenue = sorted.map(r => Number(r.revenue) || 0);
  const covers = sorted.map(r => Number(r.covers) || 0);
  const ppa = sorted.map(r => (r.revenue && r.covers) ? Math.round(Number(r.revenue) / Number(r.covers)) : null);

  const baseOpts = {
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#2a2018', titleColor: '#d4a857', bodyColor: '#f4ebdd',
        borderColor: '#3a2d23', borderWidth: 1, padding: 10, displayColors: false
      }
    },
    scales: {
      x: { ticks: { color: '#8a7866', font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 7 }, grid: { color: 'rgba(58, 45, 35, 0.4)' } },
      y: { ticks: { color: '#8a7866', font: { size: 10 } }, grid: { color: 'rgba(58, 45, 35, 0.4)' } }
    }
  };

  if (charts.revenue) charts.revenue.destroy();
  charts.revenue = new Chart(document.getElementById('chartRevenue'), {
    type: 'bar',
    data: { labels, datasets: [{ data: revenue, backgroundColor: '#d4a857', borderRadius: 4 }] },
    options: baseOpts
  });

  if (charts.ppa) charts.ppa.destroy();
  charts.ppa = new Chart(document.getElementById('chartPpa'), {
    type: 'line',
    data: { labels, datasets: [{ data: ppa, borderColor: '#7fb069', backgroundColor: 'rgba(127, 176, 105, 0.1)', tension: 0.3, fill: true, pointBackgroundColor: '#7fb069', pointRadius: 3 }] },
    options: baseOpts
  });

  if (charts.covers) charts.covers.destroy();
  charts.covers = new Chart(document.getElementById('chartCovers'), {
    type: 'bar',
    data: { labels, datasets: [{ data: covers, backgroundColor: '#b89046', borderRadius: 4 }] },
    options: baseOpts
  });
}

function renderList(reports) {
  const wrap = document.getElementById('reportList');
  if (!reports.length) {
    wrap.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">אין דוחות בטווח הנבחר</div></div>`;
    return;
  }
  wrap.innerHTML = reports.map(r => {
    const d = new Date(r.shift_date);
    const dateStr = d.toLocaleDateString('he-IL', { weekday: 'short', day: '2-digit', month: '2-digit' });
    const ppa = (r.revenue && r.covers) ? Math.round(r.revenue / r.covers) : null;
    const flags = computeFlags(r);
    return `
      <div class="report" onclick="openDetail(${r.id})">
        <div class="report-row1">
          <div class="report-date">${dateStr}</div>
          <span class="report-pill ${r.shift_type}">${shiftLabel(r.shift_type)}</span>
        </div>
        <div class="report-mgr">${escapeHtml(r.manager_name || '—')}</div>
        <div class="report-stats">
          <div class="report-stat"><div class="report-stat-label">הכנסה</div><div class="report-stat-value">${r.revenue ? '₪' + Number(r.revenue).toLocaleString('he-IL') : '—'}</div></div>
          <div class="report-stat"><div class="report-stat-label">סועדים</div><div class="report-stat-value">${r.covers || '—'}</div></div>
          <div class="report-stat"><div class="report-stat-label">PPA</div><div class="report-stat-value">${ppa ? '₪' + ppa : '—'}</div></div>
          <div class="report-stat"><div class="report-stat-label">החזרות</div><div class="report-stat-value">${r.returns_count || '0'}</div></div>
        </div>
        ${flags.length ? `<div class="report-flags">${flags.map(f => `<span class="flag ${f.type}">${f.label}</span>`).join('')}</div>` : ''}
      </div>
    `;
  }).join('');
}

function computeFlags(r) {
  const flags = [];
  if (r.cash_diff && Math.abs(Number(r.cash_diff)) >= 50) {
    flags.push({ type: 'err', label: `קופה ${Number(r.cash_diff) > 0 ? 'חוסר' : 'עודף'} ₪${Math.abs(r.cash_diff)}` });
  }
  if (r.returns_count && Number(r.returns_count) >= 3) flags.push({ type: 'warn', label: `${r.returns_count} החזרות` });
  if (r.tech_issues && r.tech_issues.trim() && r.tech_issues !== '0') flags.push({ type: 'warn', label: 'תקלה טכנית' });
  if (r.discipline_issues && r.discipline_issues.trim() && r.discipline_issues !== '0') flags.push({ type: 'err', label: 'משמעת' });
  if (r.shortages && r.shortages.trim() && r.shortages !== '0') flags.push({ type: 'warn', label: 'חוסרים' });
  if (!flags.length && r.revenue && Number(r.revenue) > 0) flags.push({ type: 'ok', label: '✓ תקין' });
  return flags;
}

function shiftLabel(t) { return ({ evening: 'ערב', morning: 'בוקר', full_day: 'יום מלא' }[t] || t); }

function openDetail(id) {
  const r = allReports.find(x => x.id === id);
  if (!r) return;
  currentDetail = r;
  const d = new Date(r.shift_date);
  const dateStr = d.toLocaleDateString('he-IL', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
  document.getElementById('detailTitle').textContent = r.manager_name || '—';
  document.getElementById('detailMeta').textContent = `${dateStr} · ${shiftLabel(r.shift_type)}`;
  const ppa = (r.revenue && r.covers) ? Math.round(r.revenue / r.covers) : null;

  let html = `<div class="detail-kpis">
    <div class="detail-kpi"><div class="detail-kpi-label">הכנסה</div><div class="detail-kpi-val">${r.revenue ? '₪' + Number(r.revenue).toLocaleString('he-IL') : '—'}</div></div>
    <div class="detail-kpi"><div class="detail-kpi-label">סועדים</div><div class="detail-kpi-val">${r.covers || '—'}</div></div>
    <div class="detail-kpi"><div class="detail-kpi-label">PPA</div><div class="detail-kpi-val">${ppa ? '₪' + ppa : '—'}</div></div>
    <div class="detail-kpi"><div class="detail-kpi-label">קופה</div><div class="detail-kpi-val" style="color:${r.cash_diff && Number(r.cash_diff) !== 0 ? '#c45a4d' : '#7fb069'}">${r.cash_diff != null ? '₪' + r.cash_diff : '—'}</div></div>
  </div>`;

  const sec = (title, content) => {
    if (!content || (typeof content === 'string' && (content.trim() === '' || content.trim() === '0'))) return '';
    return `<div class="detail-section"><div class="detail-section-title">${title}</div><div class="detail-section-text">${escapeHtml(content)}</div></div>`;
  };

  const eqItems = [
    { label: 'מטענים', val: r.chargers_count },
    { label: 'סולקים', val: r.sulkim_count },
    { label: 'טאבלטים', val: r.tablets_count },
    { label: 'תפריטים', val: r.menus_count }
  ].filter(x => x.val != null);
  if (eqItems.length) {
    html += `<div class="detail-section"><div class="detail-section-title">ציוד וספירות</div>` +
      `<div style="display:grid; grid-template-columns: repeat(${eqItems.length}, 1fr); gap:6px;">` +
      eqItems.map(it => `<div style="text-align:center; background:var(--bg-elev); border:1px solid var(--line-soft); border-radius:8px; padding:8px 4px;">
        <div style="font-size:9px; color:var(--ink-dim); letter-spacing:0.8px; text-transform:uppercase; margin-bottom:3px; font-weight:600;">${it.label}</div>
        <div style="font-family:var(--font-display); font-size:16px; color:var(--gold); font-weight:700;">${it.val}</div>
      </div>`).join('') +
      `</div></div>`;
  }

  html += sec('מהלך המשמרת', r.shift_narrative);
  html += sec('פלור', r.floor_notes);
  html += sec('מטבח', r.kitchen_notes);

  const dishes = (r.returned_dishes || []).filter(d => d && d.name);
  if (dishes.length) {
    html += `<div class="detail-section"><div class="detail-section-title">מנות חוזרות (${dishes.length})</div>`;
    dishes.forEach(d => html += `<div class="detail-dish"><strong>${escapeHtml(d.name)}</strong>${d.reason ? ` — ${escapeHtml(d.reason)}` : ''}</div>`);
    html += `</div>`;
  }
  html += sec('משמעת', r.discipline_issues);
  html += sec('זמני המתנה', r.wait_times);
  html += sec('איחורים', r.late_arrivals);
  html += sec('תקלות טכניות', r.tech_issues);
  html += sec('חוסרים', r.shortages);
  html += sec('זיכויים', r.credits);
  html += sec('משימות יומיות', r.daily_tasks);

  document.getElementById('detailBody').innerHTML = html;
  document.getElementById('detailModal').classList.add('show');
}

function closeDetail() {
  document.getElementById('detailModal').classList.remove('show');
  currentDetail = null;
}

function buildTextReport(data) {
  const lines = [];
  const fmt = (n, suffix = '') => (n === null || n === undefined || n === '') ? '—' : `${n}${suffix}`;
  const dateStr = data.shift_date ? new Date(data.shift_date).toLocaleDateString('he-IL') : '—';
  lines.push(`*סיכום משמרת — אומינו*`);
  lines.push(`${dateStr} · ${shiftLabel(data.shift_type)}`);
  lines.push(`אחמ"ש: ${data.manager_name || '—'}`);
  lines.push('');
  lines.push(`הכנסה: ${fmt(data.revenue, '₪')}`);
  lines.push(`סועדים: ${fmt(data.covers)}  |  משלוחים: ${fmt(data.deliveries)}  |  TA: ${fmt(data.takeaway)}`);
  if (data.taxis) lines.push(`מוניות: ${data.taxis}`);
  if (data.cash_diff != null && data.cash_diff !== 0) {
    lines.push(`קופה: ${data.cash_diff > 0 ? 'חוסר' : 'עודף'} ${Math.abs(data.cash_diff)}₪`);
  }
  const eqParts = [];
  if (data.chargers_count != null) eqParts.push('מטענים: ' + data.chargers_count);
  if (data.sulkim_count != null) eqParts.push('סולקים: ' + data.sulkim_count);
  if (data.tablets_count != null) eqParts.push('טאבלטים: ' + data.tablets_count);
  if (data.menus_count != null) eqParts.push('תפריטים: ' + data.menus_count);
  if (eqParts.length) { lines.push(''); lines.push('*ציוד:* ' + eqParts.join(' · ')); }
  if (data.shift_narrative) { lines.push(''); lines.push(`*מהלך המשמרת:*`); lines.push(data.shift_narrative); }
  if (data.floor_notes) { lines.push(''); lines.push(`*פלור:*`); lines.push(data.floor_notes); }
  if (data.kitchen_notes) { lines.push(''); lines.push(`*מטבח:*`); lines.push(data.kitchen_notes); }
  const dishes = (data.returned_dishes || []).filter(d => d && d.name);
  if (dishes.length) {
    lines.push(''); lines.push(`*מנות חוזרות:*`);
    dishes.forEach(d => lines.push(`• ${d.name}${d.reason ? ` — ${d.reason}` : ''}`));
  }
  if (data.discipline_issues && data.discipline_issues !== '0') { lines.push(''); lines.push(`*משמעת:* ${data.discipline_issues}`); }
  if (data.wait_times && data.wait_times !== '0') { lines.push(''); lines.push(`*זמני המתנה:* ${data.wait_times}`); }
  if (data.late_arrivals && data.late_arrivals !== '0') { lines.push(''); lines.push(`*איחורים:* ${data.late_arrivals}`); }
  if (data.tech_issues && data.tech_issues !== '0') { lines.push(''); lines.push(`*תקלות:* ${data.tech_issues}`); }
  if (data.shortages && data.shortages !== '0') { lines.push(''); lines.push(`*חוסרים:* ${data.shortages}`); }
  if (data.credits && data.credits !== '0') { lines.push(''); lines.push(`*זיכויים:* ${data.credits}`); }
  if (data.daily_tasks) { lines.push(''); lines.push(`*משימות יומיות:* ${data.daily_tasks}`); }
  return lines.join('\n');
}

async function shareDetailWhatsApp() {
  if (!currentDetail) return;
  const text = buildTextReport(currentDetail);
  if (navigator.share) {
    try { await navigator.share({ title: 'סיכום משמרת — אומינו', text }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  window.location.href = `whatsapp://send?text=${encodeURIComponent(text)}`;
  setTimeout(() => {
    if (document.hidden) return;
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
  }, 500);
}

async function copyDetail() {
  if (!currentDetail) return;
  const text = buildTextReport(currentDetail);
  let success = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      success = true;
    }
  } catch (e) {}
  if (!success) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { success = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
  const btn = document.getElementById('copyDetailBtn');
  if (success) {
    btn.textContent = '✓ הועתק';
    setTimeout(() => { btn.innerHTML = '📋 העתק'; }, 2000);
  } else { showToast('ההעתקה נכשלה', 'err'); }
}

function editReport() {
  if (!currentDetail) return;
  sessionStorage.setItem('umino-edit-record', JSON.stringify(currentDetail));
  window.location.href = `index.html?edit=${currentDetail.id}`;
}

async function deleteReport() {
  if (!currentDetail) return;
  if (!confirm(`למחוק את הדוח של ${currentDetail.manager_name} מ-${new Date(currentDetail.shift_date).toLocaleDateString('he-IL')}?`)) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/shift_reports?id=eq.${currentDetail.id}`, {
      method: 'DELETE',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    if (!res.ok) throw new Error(`${res.status}`);
    showToast('הדוח נמחק', 'ok');
    closeDetail();
    loadReports();
  } catch (e) {
    showToast('שגיאה במחיקה: ' + e.message, 'err');
  }
}

  return `
    <div class="pdf-head">
      <div class="pdf-brand">UMINO MODERN SUSHI</div>

      <div class="pdf-kpi"><div class="pdf-kpi-label">הכנסה</div><div class="pdf-kpi-value">₪${fmt(data.revenue)}</div>${ppa ? `<div class="pdf-kpi-sub">₪${ppa} לסועד</div>` : ''}</div>
      <div class="pdf-kpi"><div class="pdf-kpi-label">סועדים</div><div class="pdf-kpi-value">${fmt(data.covers)}</div></div>
      <div class="pdf-kpi"><div class="pdf-kpi-label">משלוחים/TA</div><div class="pdf-kpi-value">${(data.deliveries || 0) + (data.takeaway || 0) || '—'}</div></div>
      <div class="pdf-kpi"><div class="pdf-kpi-label">קופה</div><div class="pdf-kpi-value" style="color:${data.cash_diff && Number(data.cash_diff) !== 0 ? '#C45A4D' : '#7FB069'}">${data.cash_diff != null ? '₪' + fmt(Number(data.cash_diff)) : '—'}</div></div>
    </div>
    ${eqHtml}
    ${sec('מהלך המשמרת', data.shift_narrative)}
    ${sec('פלור', data.floor_notes)}
    ${sec('מטבח', data.kitchen_notes)}
    ${dishesHtml}
    ${exHtml}
    ${sec('תקלות טכניות', data.tech_issues)}
    ${sec('חוסרים', data.shortages)}
    ${sec('זיכויים', data.credits)}
    ${sec('משימות יומיות', data.daily_tasks)}
    <div class="pdf-foot">UMINO MODERN SUSHI · נוצר ב-${new Date().toLocaleString('he-IL')}</div>
  `;
}

async function exportDetailPdf() {
  if (!currentDetail) return;
  const data = currentDetail;
  if (typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') {
    showToast('הספריות עדיין נטענות', 'err'); return;
  }
  document.getElementById('loadingOverlay').classList.add('show');
  try {
    const tpl = document.getElementById('pdfTemplate');
    tpl.innerHTML = buildPdfTemplate(data);
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise(r => setTimeout(r, 100));
    const canvas = await html2canvas(tpl, { scale: 2, useCORS: true, backgroundColor: '#FBF7F0', logging: false });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pdfWidth = 210, pdfHeight = 297;
    const imgWidth = pdfWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;
    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    if (imgHeight <= pdfHeight) {
      pdf.addImage(imgData, 'JPEG', 0, 0, imgWidth, imgHeight);
    } else {
      let position = 0, remaining = imgHeight;
      pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
      remaining -= pdfHeight;
      while (remaining > 0) {
        position -= pdfHeight;
        pdf.addPage();
        pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
        remaining -= pdfHeight;
      }
    }
    const dStr = data.shift_date ? data.shift_date.replace(/-/g, '_') : 'unknown';
    const mgr = (data.manager_name || 'umino').replace(/[^\w\u0590-\u05FF]/g, '_');
    pdf.save(`umino_${dStr}_${mgr}.pdf`);
    tpl.innerHTML = '';
  } catch (e) {
    console.error(e);
    showToast('יצירת PDF נכשלה: ' + e.message, 'err');
  } finally {
    document.getElementById('loadingOverlay').classList.remove('show');
  }
}

function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.classList.remove('show'), type === 'err' ? 4500 : 2500);
}
